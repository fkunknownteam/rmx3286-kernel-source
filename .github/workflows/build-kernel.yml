name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, thirteen, kernelsu, 13]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ccache -M 100G

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LC_ALL=C
          export USE_CCACHE=1
          export KBUILD_BUILD_HOST=GitHubActions
          export KBUILD_BUILD_USER=INFIX
          # kernel 4.14 kconfig fixes with new host GCC
          export HOSTCFLAGS="-Wno-error -Wno-maybe-uninitialized -Wno-implicit-fallthrough"
          # Old kernel + modern GCC: vendor Makefiles add -Werror AFTER KCFLAGS,
          # so neutralize -Werror flags directly in the build files.
          echo "Neutralizing -Werror in vendor makefiles..."
          for f in $(grep -rl -- '-Werror' --include='Makefile' --include='*.mk' --include='Kbuild*' . 2>/dev/null); do
            sed -i 's/-Werror=[^ ]*/ /g; s/-Werror/ /g' "$f"
          done
          echo "Done neutralizing."
          make O=out ARCH=arm64 spaced_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

      - name: Check build output
        run: |
          ls -la out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "BUILD OK" || { echo "BUILD FAILED"; cat error.log; exit 1; }

      - name: Package AnyKernel zip
        run: |
          git clone --depth=1 https://github.com/HELLINFIX/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 ../Cosmos-kernel-spaced-$(date +%Y%m%d).zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            Cosmos-kernel-*.zip
            out/arch/arm64/boot/Image.gz-dtb
            error.log