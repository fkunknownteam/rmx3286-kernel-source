name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, thirteen, kernelsu, 13]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ccache -M 100G

      - name: Patch header files for GCC 11 compatibility
        run: |
          # Fix always_inline errors: GCC 11+ requires 'static inline' for always_inline
          # functions whose body isn't visible at call site
          sed -i 's/^inline void ksm_flock/static inline void ksm_flock/' include/linux/keyslot-manager.h
          sed -i 's/^inline void blk_crypto_flock/static inline void blk_crypto_flock/' include/linux/blk-crypto.h
          echo "Headers patched"

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LC_ALL=C
          export USE_CCACHE=1
          export KBUILD_BUILD_HOST=GitHubActions
          export KBUILD_BUILD_USER=INFIX
          # kernel 4.14 kconfig fixes with new host GCC
          export HOSTCFLAGS="-Wno-error -Wno-maybe-uninitialized -Wno-implicit-fallthrough"
          # Old kernel (4.14) + modern GCC: vendor Makefiles enable specific
          # -Werror=<warn> flags. Bare -Wno-error does NOT cancel -Werror=<warn>,
          # so disable each known problematic warning individually via KCFLAGS.
          export KCFLAGS=" \
            -Wno-error=strict-prototypes -Wno-error=maybe-uninitialized \
            -Wno-error=unused-but-set-variable -Wno-error=array-bounds \
            -Wno-error=stringop-truncation -Wno-error=stringop-overflow \
            -Wno-error=format-truncation -Wno-error=sizeof-pointer-memaccess \
            -Wno-error=restrict -Wno-error=zero-length-bounds \
            -Wno-error=packed-not-aligned -Wno-error=shift-overflow \
            -Wno-error=implicit-fallthrough -Wno-error=address-of-packed-member \
            -Wno-error=unused-variable -Wno-error=unused-function \
            -Wno-error=missing-prototypes -Wno-error=parentheses \
            -Wno-error=unused-result -Wno-error=format-overflow \
            -Wno-error=deprecated-declarations -Wno-error=pointer-arith \
            -Wno-error=unused-parameter -Wno-error=int-in-bool-context \
            -Wno-error=enum-conversion -Wno-error=implicit-int \
            -Wno-error=implicit-function-declaration -Wno-error=return-type \
            -Wno-error=incompatible-pointer-types -Wno-error=discarded-qualifiers \
            -Wno-error=sizeof-pointer-div -Wno-error=cast-function-type \
            -Wno-error=stringop-overread \
            -Wno-error=misleading-indentation"
          make O=out ARCH=arm64 spaced_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

      - name: Check build output
        run: |
          ls -la out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "BUILD OK" || { echo "BUILD FAILED"; cat error.log; exit 1; }

      - name: Package AnyKernel zip
        run: |
          git clone --depth=1 https://github.com/HELLINFIX/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 ../Cosmos-kernel-spaced-$(date +%Y%m%d).zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            Cosmos-kernel-*.zip
            out/arch/arm64/boot/Image.gz-dtb
            error.log