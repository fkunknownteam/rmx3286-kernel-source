name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, thirteen, kernelsu, 13]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ccache -M 100G

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LC_ALL=C
          export USE_CCACHE=1
          export KBUILD_BUILD_HOST=GitHubActions
          export KBUILD_BUILD_USER=INFIX
          # kernel 4.14 kconfig fixes with new host GCC
          export HOSTCFLAGS="-Wno-error -Wno-maybe-uninitialized -Wno-implicit-fallthrough"
          # kernel 4.14 source + modern GCC: disable warnings-as-errors that break the build
          export KCFLAGS="-Wno-error -Wno-error=strict-prototypes -Wno-error=maybe-uninitialized \
            -Wno-error=unused-but-set-variable -Wno-error=array-bounds -Wno-error=stringop-truncation \
            -Wno-error=stringop-overflow= -Wno-error=format-truncation -Wno-error=sizeof-pointer-memaccess \
            -Wno-error=restrict -Wno-error=zero-length-bounds -Wno-error=packed-not-aligned \
            -Wno-error=shift-overflow -Wno-error=implicit-fallthrough -Wno-error=address-of-packed-member \
            -Wno-error=unused-variable -Wno-error=unused-function -Wno-error=missing-prototypes"
          make O=out ARCH=arm64 spaced_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log

      - name: Check build output
        run: |
          ls -la out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "BUILD OK" || { echo "BUILD FAILED"; cat error.log; exit 1; }

      - name: Package AnyKernel zip
        run: |
          git clone --depth=1 https://github.com/HELLINFIX/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 ../Cosmos-kernel-spaced-$(date +%Y%m%d).zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            Cosmos-kernel-*.zip
            out/arch/arm64/boot/Image.gz-dtb
            error.log